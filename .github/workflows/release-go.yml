name: Release Go

on:
  push:
    tags: ["go/v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated Go release tag to publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  GOPATH: ${{ github.workspace }}/release-source/.cache/go
  GOMODCACHE: ${{ github.workspace }}/release-source/.cache/go/mod
  GOCACHE: ${{ github.workspace }}/release-source/.cache/go/build
  GOFLAGS: -modcacherw
  GOTOOLCHAIN: local
  GOLANGCI_LINT_CACHE: ${{ github.workspace }}/release-source/.cache/go/lint
  FLYRAIL_REQUIRE_FIXTURES: "1"
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.cache/python
  UV_TOOL_DIR: ${{ github.workspace }}/.cache/uv-tools
  UV_TOOL_BIN_DIR: ${{ github.workspace }}/.cache/uv-bin
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      release-commit: ${{ steps.identity.outputs.release-commit }}
      prerelease: ${{ steps.project.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: nielsmadan/curtaincall@v2.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Validate annotated tag and ancestry
        id: identity
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Release retries must run from main" >&2
              exit 1
            fi
            RELEASE_COMMIT=$(curtains ci validate-tag --config go/scripts/release.json "$RELEASE_TAG")
          else
            RELEASE_COMMIT=$(curtains ci validate-tag --config go/scripts/release.json \
              "$RELEASE_TAG" "$GITHUB_SHA")
          fi
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          echo "release-commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Check out exact release source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.identity.outputs.release-commit }}
          path: release-source

      - name: Validate module metadata
        id: project
        working-directory: release-source
        run: |
          python ../python/scripts/release_workflow.py project-metadata \
            "$RELEASE_TAG" go/go.mod >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7.1.0
        with:
          go-version: "1.27.3"
          cache: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.12.13"
          enable-cache: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.2"
          no-cache: true

      # The Go interop scripts build the Swift driver through swift/Justfile.
      - name: Install pinned just locally
        run: |
          tools="$RUNNER_TEMP/just"
          mkdir -p "$tools"
          curl --fail --silent --show-error --location \
            https://github.com/casey/just/releases/download/1.59.0/just-1.59.0-aarch64-apple-darwin.tar.gz \
            --output "$tools/archive.tar.gz"
          printf '%s  %s\n' \
            6574cea774ed4cae12e24b6aa11857de33e80dab4667cf628fd5840df96a2a9d \
            "$tools/archive.tar.gz" | shasum -a 256 --check --strict
          tar -xzf "$tools/archive.tar.gz" -C "$tools" just
          echo "$tools" >> "$GITHUB_PATH"

      - name: Require pinned Go and runtime prerequisites
        run: |
          test "$(go env GOVERSION)" = go1.27.3
          python -c "import sys; assert sys.version_info[:2] == (3, 14)"
          swift --version
          just --version
          npm install --global npm@11.19.0
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
          test "$(bun --version)" = "1.4.2"

      - name: Provision reference environments
        working-directory: release-source
        run: |
          set -euo pipefail
          python python/scripts/check.py sync
          lint="$(python -I go/scripts/tools.py golangci-lint)"
          dirname "$lint" >> "$GITHUB_PATH"

      - name: Run full release gates
        working-directory: release-source/go
        run: |
          go run ./internal/unicodex/gen -check \
            internal/unicodex/testdata/CaseFolding-16.0.0.txt internal/unicodex/casefold_table.go
          python -I scripts/generate_errno_text.py --check
          python -I scripts/check_case_folding.py
          golangci-lint fmt --diff
          go vet ./...
          golangci-lint run ./...
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./...
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go vet ./...
          done
          for os in windows freebsd; do
            GOOS="$os" GOARCH=amd64 go vet ./...
            GOOS="$os" GOARCH=amd64 go build ./...
          done
          go test -short ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Run integration gates
        working-directory: release-source
        run: |
          python/.venv/bin/python -B go/scripts/extract_state_vectors.py > "$RUNNER_TEMP/state_vectors.tsv"
          diff "$RUNNER_TEMP/state_vectors.tsv" go/flyrail/testdata/state_vectors.tsv
          (cd go && FLYRAIL_DIFFERENTIAL_PYTHON=../python/.venv/bin/python \
            go test -race -count=1 -tags integration ./...)
          python/.venv/bin/python -B go/scripts/check_differential.py
          python/.venv/bin/python -B go/scripts/check_transaction_interop.py
          python/.venv/bin/python -B go/scripts/check_native_interop.py

      - name: Verify extracted module
        working-directory: release-source
        run: |
          (cd go && go mod verify)
          python -I -B go/scripts/package_qa.py

      - name: Assemble verified release notes
        working-directory: release-source
        run: |
          mkdir -p .cache/release/bundle
          uvx git-cliff@2.13.1 \
            --config go/cliff.toml \
            --include-path "go/**" \
            --current --strip all \
            -o .cache/release/bundle/release-notes.md
          sed -i '' '/^## \[/d' .cache/release/bundle/release-notes.md
          PREVIOUS_TAG=$(curtains ci previous-tag --directory "$GITHUB_WORKSPACE" \
            --config go/scripts/release.json "$RELEASE_TAG")
          if [ -n "$PREVIOUS_TAG" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$RELEASE_TAG" \
              >> .cache/release/bundle/release-notes.md
          fi

      - name: Save verified release notes
        uses: actions/upload-artifact@v7.0.2
        with:
          name: go-release-bundle
          path: release-source/.cache/release/bundle
          if-no-files-found: error
          include-hidden-files: true

  publish-github:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: nielsmadan/curtaincall@v2.0.1

      - name: Revalidate trusted publication code
        env:
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
        run: |
          test "$(curtains ci validate-tag --config go/scripts/release.json \
            "$RELEASE_TAG" "$RELEASE_COMMIT")" = "$RELEASE_COMMIT"

      - uses: actions/download-artifact@v8.0.2
        with:
          name: go-release-bundle
          path: release-bundle

      - name: Publish Go GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
        run: |
          args=(--not-latest)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          curtains ci publish --config go/scripts/release.json "${args[@]}" \
            "$RELEASE_TAG" "$RELEASE_COMMIT" \
            --notes release-bundle/release-notes.md
