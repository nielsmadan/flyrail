name: Release Swift

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated Swift release tag to publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.cache/python
  UV_TOOL_DIR: ${{ github.workspace }}/.cache/uv-tools
  UV_TOOL_BIN_DIR: ${{ github.workspace }}/.cache/uv-bin
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      release-commit: ${{ steps.identity.outputs.release-commit }}
      prerelease: ${{ steps.project.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: nielsmadan/curtaincall@v1.2.0

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Validate annotated tag and ancestry
        id: identity
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Release retries must run from main" >&2
              exit 1
            fi
            RELEASE_COMMIT=$(curtains ci validate-tag --config swift/scripts/release.json "$RELEASE_TAG")
          else
            RELEASE_COMMIT=$(curtains ci validate-tag --config swift/scripts/release.json \
              "$RELEASE_TAG" "$GITHUB_SHA")
          fi
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          echo "release-commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Check out exact release source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.identity.outputs.release-commit }}
          path: release-source

      - name: Validate package metadata
        id: project
        working-directory: release-source
        run: |
          python ../python/scripts/release_workflow.py project-metadata \
            "$RELEASE_TAG" Package.swift >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.13"
          enable-cache: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.2"
          no-cache: true

      - uses: ./.github/actions/setup-swift-tools

      - name: Require pinned Swift and runtime prerequisites
        run: |
          swift --version
          python -c "import sys; assert sys.version_info[:2] == (3, 14)"
          npm install --global npm@11.19.0
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
          test "$(bun --version)" = "1.4.2"

      - name: Provision reference environments
        working-directory: release-source
        env:
          CARGO_HOME: ${{ github.workspace }}/release-source/.cache/cargo-home
        run: |
          python python/scripts/check.py sync
          cargo fetch --locked --manifest-path rust/Cargo.toml

      - name: Run full release gates
        working-directory: release-source
        run: |
          python -B swift/scripts/check_case_folding.py
          swiftformat --lint --config swift/.swiftformat swift/Sources swift/Tests
          swiftlint lint --strict --config swift/.swiftlint.yml swift/Sources swift/Tests
          swift build --scratch-path .cache/swift -Xswiftc -warnings-as-errors
          swift test --scratch-path .cache/swift -Xswiftc -warnings-as-errors

      - name: Run integration gates
        working-directory: release-source
        env:
          FLYRAIL_SWIFT_INTEGRATION: "1"
        run: |
          python/.venv/bin/python -B swift/scripts/check_differential.py
          python/.venv/bin/python -B swift/scripts/check_native_interop.py
          python/.venv/bin/python -B swift/scripts/check_transaction_interop.py
          swift test --scratch-path .cache/swift -Xswiftc -warnings-as-errors \
            --filter packagedHookRuntimeExecutesSharedHarnesses

      - name: Verify extracted package
        working-directory: release-source
        run: python/.venv/bin/python -B swift/scripts/package_qa.py

      - name: Assemble verified release notes
        working-directory: release-source
        run: |
          mkdir -p .cache/release/bundle
          uvx git-cliff@2.13.1 \
            --config swift/cliff.toml \
            --include-path "swift/**" \
            --include-path "Package.swift" \
            --include-path "Package.resolved" \
            --current --strip all \
            -o .cache/release/bundle/release-notes.md
          sed -i '' '/^## \[/d' .cache/release/bundle/release-notes.md
          PREVIOUS_TAG=$(curtains ci previous-tag --directory "$GITHUB_WORKSPACE" \
            --config swift/scripts/release.json "$RELEASE_TAG")
          if [ -n "$PREVIOUS_TAG" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$RELEASE_TAG" \
              >> .cache/release/bundle/release-notes.md
          fi

      - name: Save verified release notes
        uses: actions/upload-artifact@v7.0.2
        with:
          name: swift-release-bundle
          path: release-source/.cache/release/bundle
          if-no-files-found: error
          include-hidden-files: true

  publish-github:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: nielsmadan/curtaincall@v1.2.0

      - name: Revalidate trusted publication code
        env:
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
        run: |
          test "$(curtains ci validate-tag --config swift/scripts/release.json \
            "$RELEASE_TAG" "$RELEASE_COMMIT")" = "$RELEASE_COMMIT"

      - uses: actions/download-artifact@v8.0.2
        with:
          name: swift-release-bundle
          path: release-bundle

      - name: Publish Swift GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
        run: |
          args=(--not-latest)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          curtains ci publish --config swift/scripts/release.json "${args[@]}" \
            "$RELEASE_TAG" "$RELEASE_COMMIT" \
            --notes release-bundle/release-notes.md
