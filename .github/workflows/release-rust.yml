name: Release Rust

on:
  push:
    tags: ["rust-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated Rust release tag to publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: never
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.cache/python
  UV_TOOL_DIR: ${{ github.workspace }}/.cache/uv-tools
  UV_TOOL_BIN_DIR: ${{ github.workspace }}/.cache/uv-bin
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      release-commit: ${{ steps.identity.outputs.release-commit }}
      version: ${{ steps.project.outputs.version }}
      prerelease: ${{ steps.project.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate annotated tag and ancestry
        id: identity
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Release retries must run from main" >&2
              exit 1
            fi
            RELEASE_COMMIT=$(python python/scripts/release_workflow.py \
              validate-tag --component rust "$RELEASE_TAG")
          else
            RELEASE_COMMIT=$(python python/scripts/release_workflow.py \
              validate-tag --component rust "$RELEASE_TAG" "$GITHUB_SHA")
          fi
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          echo "release-commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.identity.outputs.release-commit }}
          path: release-source

      - name: Validate crate metadata
        id: project
        working-directory: release-source
        run: |
          python ../python/scripts/release_workflow.py project-metadata \
            "$RELEASE_TAG" rust/Cargo.toml > "$RUNNER_TEMP/metadata"
          cat "$RUNNER_TEMP/metadata" >> "$GITHUB_OUTPUT"
          sed -n 's/^version=/VERSION=/p' "$RUNNER_TEMP/metadata" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.13"
          enable-cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
          no-cache: true

      - name: Require pinned interop prerequisites
        run: |
          npm install --global npm@11.19.0
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
          test "$(bun --version)" = "1.4.2"

      - name: Run full release gates
        working-directory: release-source
        env:
          CARGO_HOME: ${{ github.workspace }}/release-source/.cache/cargo-home
          FLYRAIL_DIFFERENTIAL_PYTHON: ../python/.venv/bin/python
        run: |
          python python/scripts/check.py sync
          python/.venv/bin/python -c "import flyrail, tomlkit"
          cd rust
          cargo fmt --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features

      - name: Verify extracted crate archives
        working-directory: release-source
        run: python rust/scripts/package_qa.py

      - name: Package and dry-run publish
        working-directory: release-source/rust
        env:
          CARGO_HOME: ${{ github.workspace }}/release-source/.cache/cargo-home
        run: |
          cargo publish -p flyrail --locked --dry-run
          test -f "target/package/flyrail-${VERSION}.crate"

      - name: Assemble verified release bundle
        working-directory: release-source
        run: |
          mkdir -p .cache/release/bundle/dist
          cp "rust/target/package/flyrail-${VERSION}.crate" .cache/release/bundle/dist/
          uvx git-cliff@2.13.1 \
            --config rust/cliff.toml \
            --include-path "rust/**" \
            --include-path "rust-toolchain.toml" \
            --current --strip all \
            -o .cache/release/bundle/release-notes.md
          sed -i '/^## \[/d' .cache/release/bundle/release-notes.md
          PREVIOUS_TAG=$(python ../python/scripts/release_workflow.py \
            previous-tag "$RELEASE_TAG")
          if [ -n "$PREVIOUS_TAG" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$RELEASE_TAG" \
              >> .cache/release/bundle/release-notes.md
          fi

      - name: Save verified release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-release-bundle
          path: release-source/.cache/release/bundle
          if-no-files-found: error
          include-hidden-files: true

  platform-checks:
    needs: verify
    name: Rust (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.release-commit }}

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.13"
          enable-cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
          no-cache: true

      - name: Run supported-platform checks
        env:
          FLYRAIL_DIFFERENTIAL_PYTHON: ../python/.venv/bin/python
        run: |
          npm install --global npm@11.19.0
          python python/scripts/check.py sync
          cd rust
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features

  publish-crates:
    needs: [verify, platform-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      CRATE_URL: https://crates.io/api/v1/crates/flyrail/${{ needs.verify.outputs.version }}
      CRATES_USER_AGENT: flyrail-release (https://github.com/nielsmadan/flyrail)
      HAS_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.release-commit }}

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-release-bundle
          path: release-bundle

      - name: Check for an existing crates.io version
        id: existing
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --user-agent "$CRATES_USER_AGENT" "$CRATE_URL")
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io returned HTTP $status for $CRATE_URL" >&2; exit 1 ;;
          esac

      - name: Repackage and compare with the verified crate
        if: steps.existing.outputs.published == 'false'
        working-directory: rust
        run: |
          cargo package -p flyrail --locked --no-verify
          cmp "target/package/flyrail-${VERSION}.crate" \
            "../release-bundle/dist/flyrail-${VERSION}.crate"

      - name: Authenticate with crates.io trusted publishing
        id: auth
        if: steps.existing.outputs.published == 'false' && env.HAS_REGISTRY_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: steps.existing.outputs.published == 'false'
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p flyrail --locked --no-verify

      - name: Confirm crates.io serves the verified crate
        run: |
          expected=$(sha256sum "release-bundle/dist/flyrail-${VERSION}.crate" | cut -d' ' -f1)
          published=$(curl --fail --silent --show-error --retry 5 --retry-delay 10 \
            --retry-all-errors --user-agent "$CRATES_USER_AGENT" "$CRATE_URL" \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['version']['checksum'])")
          if [ "$published" != "$expected" ]; then
            echo "crates.io flyrail $VERSION checksum $published differs from verified $expected" >&2
            exit 1
          fi

  publish-github:
    needs: [verify, publish-crates]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Revalidate trusted publication code
        env:
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
        run: |
          test "$(python python/scripts/release_workflow.py validate-tag --component rust \
            "$RELEASE_TAG" "$RELEASE_COMMIT")" = "$RELEASE_COMMIT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-release-bundle
          path: release-bundle

      - name: Publish Rust GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          args=()
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          python python/scripts/release_workflow.py publish \
            "$RELEASE_TAG" \
            "Flyrail for Rust $VERSION" \
            release-bundle/release-notes.md \
            "$RELEASE_COMMIT" \
            release-bundle/dist/* "${args[@]}"
