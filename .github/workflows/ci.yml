name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Affected checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.select.outputs.python }}
      rust: ${{ steps.select.outputs.rust }}
      swift: ${{ steps.select.outputs.swift }}
      go: ${{ steps.select.outputs.go }}
      typescript: ${{ steps.select.outputs.typescript }}
      workflow: ${{ steps.select.outputs.workflow }}
    steps:
      # Rust tests compare against Python, and Swift and Go tests against Python and Rust.
      - uses: dorny/paths-filter@v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            shared: &shared
              - 'spec/**'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'Justfile'
              - 'lefthook.yml'
            python: &python
              - *shared
              - 'python/**'
            rust: &rust
              - *python
              - 'rust/**'
              - 'rust-toolchain.toml'
            swift:
              - *rust
              - 'swift/**'
              - 'Package.swift'
              - 'Package.resolved'
            go:
              - *rust
              - 'go/**'
              - 'swift/scripts/**'
            typescript:
              - *rust
              - 'typescript/**'
            workflow:
              - '.github/**'
      - name: Select affected checks
        id: select
        env:
          # The pull request files API lists at most 3000 files.
          RUN_ALL: ${{ github.event_name != 'pull_request' || github.event.pull_request.changed_files >= 3000 }}
          PYTHON: ${{ steps.filter.outputs.python }}
          RUST: ${{ steps.filter.outputs.rust }}
          SWIFT: ${{ steps.filter.outputs.swift }}
          GO: ${{ steps.filter.outputs.go }}
          TYPESCRIPT: ${{ steps.filter.outputs.typescript }}
          WORKFLOW: ${{ steps.filter.outputs.workflow }}
        run: |
          if [ "$RUN_ALL" = true ]; then
            PYTHON=true RUST=true SWIFT=true GO=true TYPESCRIPT=true WORKFLOW=true
          fi
          {
            echo "python=$PYTHON"
            echo "rust=$RUST"
            echo "swift=$SWIFT"
            echo "go=$GO"
            echo "typescript=$TYPESCRIPT"
            echo "workflow=$WORKFLOW"
          } >> "$GITHUB_OUTPUT"

  check:
    name: Python (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_MANAGED_PYTHON: '1'
      FLYRAIL_TEST_CODEX_LOGIN_SHELL: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.13'
          enable-cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Require pinned runtime prerequisites
        run: |
          npm install --global npm@11.19.0
          python -c "import sys; assert sys.version_info[:2] == (3, 14)"
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
          test "$(bun --version)" = "1.4.2"
      - name: Fast checks
        run: python python/scripts/check.py check

  rust-check:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.13'
          enable-cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Require pinned interop prerequisites
        run: |
          npm install --global npm@11.19.0
          python -c "import sys; assert sys.version_info[:2] == (3, 11)"
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
          test "$(bun --version)" = "1.4.2"
          test -f python/scripts/interop_driver.py
          test -f spec/fixtures/configurations.json
          test -f spec/fixtures/hooks.json
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: rust
      - name: Rust formatting
        working-directory: rust
        run: cargo fmt --check
      - name: Rust lint
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Provision pinned Python differential environment
        run: python python/scripts/check.py sync
      - name: Assert differential Python prerequisites
        run: python/.venv/bin/python -c "import flyrail, tomlkit"
      - name: Rust tests
        working-directory: rust
        env:
          FLYRAIL_DIFFERENTIAL_PYTHON: ../python/.venv/bin/python
        run: cargo test --workspace

  swift-check:
    name: Swift (macos-26)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.13'
          enable-cache: false
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: rust
      - uses: ./.github/actions/setup-swift-tools
      - name: Require pinned Swift prerequisites
        run: |
          swift --version
          python -c "import sys; assert sys.version_info[:2] == (3, 14)"
      - name: Provision pinned Python differential environment
        run: python python/scripts/check.py sync
      # Swift reference tests run cargo offline against this checkout-local CARGO_HOME.
      - name: Fetch Rust reference dependencies
        env:
          CARGO_HOME: ${{ github.workspace }}/.cache/cargo-home
        run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - name: Swift case folding
        run: python -B swift/scripts/check_case_folding.py
      - name: Swift formatting
        run: swiftformat --lint --config swift/.swiftformat swift/Sources swift/Tests
      - name: Swift lint
        run: swiftlint lint --strict --config swift/.swiftlint.yml swift/Sources swift/Tests
      - name: Swift build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Swift tests
        run: swift test -Xswiftc -warnings-as-errors

  swift-integration:
    name: Swift integration (macos-26)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.13'
          enable-cache: false
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: rust
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      - uses: ./.github/actions/setup-swift-tools
      - name: Require pinned Swift and runtime prerequisites
        run: |
          swift --version
          python -c "import sys; assert sys.version_info[:2] == (3, 14)"
          npm install --global npm@11.19.0
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
          test "$(bun --version)" = "1.4.2"
      - name: Provision pinned Python differential environment
        run: python python/scripts/check.py sync
      # Swift reference tests run cargo offline against this checkout-local CARGO_HOME.
      - name: Fetch Rust reference dependencies
        env:
          CARGO_HOME: ${{ github.workspace }}/.cache/cargo-home
        run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - name: Swift build
        run: swift build --scratch-path .cache/swift -Xswiftc -warnings-as-errors
      - name: Swift differential and interop scripts
        run: |
          python/.venv/bin/python -B swift/scripts/check_differential.py
          python/.venv/bin/python -B swift/scripts/check_native_interop.py
          python/.venv/bin/python -B swift/scripts/check_transaction_interop.py
      - name: Swift packaged hook runtime
        env:
          FLYRAIL_SWIFT_INTEGRATION: '1'
        run: |
          swift test --scratch-path .cache/swift -Xswiftc -warnings-as-errors \
            --filter packagedHookRuntimeExecutesSharedHarnesses
      - name: Swift package QA
        run: python/.venv/bin/python -B swift/scripts/package_qa.py

  rust-integration:
    name: Rust integration (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.13'
          enable-cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Require pinned interop prerequisites
        run: |
          npm install --global npm@11.19.0
          python -c "import sys; assert sys.version_info[:2] == (3, 11)"
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
          test "$(bun --version)" = "1.4.2"
          test -f python/scripts/interop_driver.py
          test -f spec/fixtures/configurations.json
          test -f spec/fixtures/hooks.json
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: rust
      - name: Provision pinned Python differential environment
        run: python python/scripts/check.py sync
      - name: Assert differential Python prerequisites
        run: python/.venv/bin/python -c "import flyrail, tomlkit"
      - name: Rust integration tests
        working-directory: rust
        env:
          FLYRAIL_DIFFERENTIAL_PYTHON: ../python/.venv/bin/python
        run: cargo test --workspace --all-targets --all-features

  integration:
    name: Integration (${{ matrix.os }}, Python ${{ matrix.python }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_MANAGED_PYTHON: '1'
      FLYRAIL_TEST_CODEX_LOGIN_SHELL: '1'
      FLYRAIL_COMBINED_COVERAGE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.13'
          enable-cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Require pinned runtime prerequisites
        run: |
          npm install --global npm@11.19.0
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
          test "$(bun --version)" = "1.4.2"
          test -f python/scripts/interop_driver.py
          test -f spec/fixtures/configurations.json
          test -f spec/fixtures/hooks.json
      - name: Integration tests and package QA
        run: python python/scripts/check.py check-integration
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ matrix.os }}-python-${{ matrix.python }}
          path: python/.cache/coverage/.coverage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  coverage:
    name: Combined coverage
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_PYTHON: '3.14'
      UV_MANAGED_PYTHON: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.13'
          enable-cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: coverage-*
          path: python/.cache/coverage/platforms
      - name: Coverage gate across platforms
        run: python python/scripts/check.py combine-coverage

  go-check:
    name: Go (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    env:
      GOPATH: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/go/mod
      GOCACHE: ${{ github.workspace }}/.cache/go/build
      GOFLAGS: -modcacherw
      GOTOOLCHAIN: local
      GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.cache/go/lint
      FLYRAIL_REQUIRE_FIXTURES: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Require pinned Go prerequisites
        run: |
          test "$(go env GOVERSION)" = go1.27.3
          python -c "import sys; assert sys.version_info[:2] == (3, 14)"
      - name: Install pinned golangci-lint locally
        working-directory: go
        run: |
          set -euo pipefail
          lint="$(python -I scripts/tools.py golangci-lint)"
          dirname "$lint" >> "$GITHUB_PATH"
      - name: Go generated tables
        working-directory: go
        run: |
          go run ./internal/unicodex/gen -check \
            internal/unicodex/testdata/CaseFolding-16.0.0.txt internal/unicodex/casefold_table.go
          python -I scripts/generate_errno_text.py --check
          python -I scripts/check_case_folding.py
      - name: Go formatting
        working-directory: go
        run: golangci-lint fmt --diff
      - name: Go vet
        working-directory: go
        run: go vet ./...
      - name: Go lint
        working-directory: go
        run: golangci-lint run ./...
      - name: Go cross-platform builds
        working-directory: go
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./...
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go vet ./...
          done
          for os in windows freebsd; do
            GOOS="$os" GOARCH=amd64 go vet ./...
            GOOS="$os" GOARCH=amd64 go build ./...
          done
      - name: Go tests
        working-directory: go
        run: go test -short ./...
      - name: Go vulnerability audit
        working-directory: go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  go-integration:
    name: Go integration (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    env:
      GOPATH: ${{ github.workspace }}/.cache/go
      GOMODCACHE: ${{ github.workspace }}/.cache/go/mod
      GOCACHE: ${{ github.workspace }}/.cache/go/build
      GOFLAGS: -modcacherw
      GOTOOLCHAIN: local
      GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.cache/go/lint
      FLYRAIL_REQUIRE_FIXTURES: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.13'
          enable-cache: false
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: rust
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      # The Go interop scripts build the Swift driver through swift/Justfile on macOS.
      - name: Install pinned just locally
        if: runner.os == 'macOS'
        run: |
          mkdir -p .cache/tools/just
          curl --fail --silent --show-error --location \
            https://github.com/casey/just/releases/download/1.59.0/just-1.59.0-aarch64-apple-darwin.tar.gz \
            --output .cache/tools/just/archive.tar.gz
          printf '%s  %s\n' \
            6574cea774ed4cae12e24b6aa11857de33e80dab4667cf628fd5840df96a2a9d \
            .cache/tools/just/archive.tar.gz | shasum -a 256 --check --strict
          tar -xzf .cache/tools/just/archive.tar.gz -C .cache/tools/just just
          echo "$GITHUB_WORKSPACE/.cache/tools/just" >> "$GITHUB_PATH"
      - name: Require pinned Go and runtime prerequisites
        run: |
          test "$(go env GOVERSION)" = go1.27.3
          python -c "import sys; assert sys.version_info[:2] == (3, 14)"
          npm install --global npm@11.19.0
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
          test "$(bun --version)" = "1.4.2"
          if [ "$RUNNER_OS" = macOS ]; then
            swift --version
            just --version
          fi
      - name: Provision pinned Python differential environment
        run: python python/scripts/check.py sync
      - name: Assert differential Python prerequisites
        run: python/.venv/bin/python -c "import flyrail, tomlkit"
      - name: Go state vectors
        run: |
          python/.venv/bin/python -B go/scripts/extract_state_vectors.py > "$RUNNER_TEMP/state_vectors.tsv"
          diff "$RUNNER_TEMP/state_vectors.tsv" go/flyrail/testdata/state_vectors.tsv
      - name: Go integration tests
        working-directory: go
        env:
          FLYRAIL_DIFFERENTIAL_PYTHON: ../python/.venv/bin/python
        run: go test -race -count=1 -tags integration ./...
      - name: Go differential and interop scripts
        run: |
          python/.venv/bin/python -B go/scripts/check_differential.py
          python/.venv/bin/python -B go/scripts/check_transaction_interop.py
          python/.venv/bin/python -B go/scripts/check_native_interop.py
      - name: Go package QA
        run: |
          (cd go && go mod verify)
          python -I -B go/scripts/package_qa.py

  typescript-check:
    name: TypeScript (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/typescript/target
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      FLYRAIL_REQUIRE_FIXTURES: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Require pinned Node prerequisites
        run: |
          npm install --global npm@11.19.0
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: typescript/native -> ../../.cache/typescript/target
      - name: TypeScript install
        working-directory: typescript
        run: npm ci
      - name: TypeScript dependency check
        working-directory: typescript
        run: |
          npm ls --depth=0
          python3 -I -B scripts/check_cargo_lock.py
      - name: TypeScript native build
        working-directory: typescript
        run: npm run build:native
      - name: TypeScript formatting
        working-directory: typescript
        run: |
          npm run format:check
          cargo fmt --check --manifest-path native/Cargo.toml
      - name: TypeScript lint
        working-directory: typescript
        run: |
          npm run lint
          cargo clippy --manifest-path native/Cargo.toml --all-targets --all-features -- -D warnings
      - name: TypeScript type check
        working-directory: typescript
        run: npm run typecheck
      - name: TypeScript tests
        working-directory: typescript
        run: npm test
      - name: TypeScript build
        working-directory: typescript
        run: npm run build

  typescript-integration:
    name: TypeScript integration (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/typescript/target
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      FLYRAIL_REQUIRE_FIXTURES: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.13'
          enable-cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Require pinned TypeScript prerequisites
        run: |
          npm install --global npm@11.19.0
          python -c "import sys; assert sys.version_info[:2] == (3, 14)"
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
          test "$(bun --version)" = "1.4.2"
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: |
            rust
            typescript/native -> ../../.cache/typescript/target
      - name: Provision pinned Python differential environment
        run: python python/scripts/check.py sync
      - name: Assert differential Python prerequisites
        run: python/.venv/bin/python -c "import flyrail, tomlkit"
      - name: Build the Rust interop driver
        run: env -u CARGO_TARGET_DIR cargo build --locked --manifest-path rust/Cargo.toml --example interop --features interop-test-seams
      - name: TypeScript install
        working-directory: typescript
        run: npm ci
      - name: TypeScript native build
        working-directory: typescript
        run: npm run build:native
      - name: TypeScript integration tests
        working-directory: typescript
        run: npm run test:integration
      - name: TypeScript Bun smoke
        working-directory: typescript
        run: bun run test/runtime/bun-smoke.ts
      - name: TypeScript release addon and build
        working-directory: typescript
        run: |
          npm run build:native:release
          npm run build
      # Electron's main process runs unsandboxed on macos-26; package QA exits 3 when a step is blocked.
      - name: TypeScript package QA
        run: python -I -B typescript/scripts/package_qa.py

  audit-dependencies:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.13'
          enable-cache: false
      - name: Audit all locked dependency groups and platforms
        run: python python/scripts/check.py audit-dependencies

  check-workflow:
    name: Workflow validation
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Install pinned actionlint locally
        shell: bash
        run: |
          mkdir -p .cache/tools/actionlint
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output .cache/tools/actionlint/archive.tar.gz
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            .cache/tools/actionlint/archive.tar.gz | sha256sum --check --strict
          tar -xzf .cache/tools/actionlint/archive.tar.gz -C .cache/tools/actionlint actionlint
      - name: Validate workflows
        run: python python/scripts/check.py check-workflow

  result:
    name: CI result
    if: always()
    needs:
      - changes
      - check
      - rust-check
      - rust-integration
      - integration
      - coverage
      - swift-check
      - swift-integration
      - go-check
      - go-integration
      - typescript-check
      - typescript-integration
      - audit-dependencies
      - check-workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected check to pass
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
