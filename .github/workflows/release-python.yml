name: Release Python

on:
  push:
    tags: ["python-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated Python release tag to publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.cache/python
  UV_TOOL_DIR: ${{ github.workspace }}/.cache/uv-tools
  UV_TOOL_BIN_DIR: ${{ github.workspace }}/.cache/uv-bin
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      release-commit: ${{ steps.identity.outputs.release-commit }}
      version: ${{ steps.project.outputs.version }}
      prerelease: ${{ steps.project.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate annotated tag and ancestry
        id: identity
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Release retries must run from main" >&2
              exit 1
            fi
            RELEASE_COMMIT=$(python python/scripts/release_workflow.py \
              validate-tag "$RELEASE_TAG")
          else
            RELEASE_COMMIT=$(python python/scripts/release_workflow.py \
              validate-tag "$RELEASE_TAG" "$GITHUB_SHA")
          fi
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          echo "release-commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.identity.outputs.release-commit }}
          path: release-source

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
          no-cache: true

      - name: Validate project metadata
        id: project
        working-directory: release-source
        run: |
          python ../python/scripts/release_workflow.py project-metadata \
            "$RELEASE_TAG" python/pyproject.toml >> "$GITHUB_OUTPUT"
          echo "VERSION=${RELEASE_TAG#python-v}" >> "$GITHUB_ENV"

      - name: Install pinned actionlint
        working-directory: release-source
        run: |
          mkdir -p .cache/tools/actionlint
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output .cache/tools/actionlint/archive.tar.gz
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            .cache/tools/actionlint/archive.tar.gz | sha256sum --check --strict
          tar -xzf .cache/tools/actionlint/archive.tar.gz \
            -C .cache/tools/actionlint actionlint

      - name: Run full release gates
        working-directory: release-source
        env:
          UV_PYTHON: "3.11"
          UV_MANAGED_PYTHON: "1"
          FLYRAIL_TEST_CODEX_LOGIN_SHELL: "1"
        run: |
          python python/scripts/check.py check
          python python/scripts/check.py audit-dependencies
          python python/scripts/check.py check-workflow

      - name: Build sdist then wheel from sdist
        working-directory: release-source/python
        run: |
          rm -rf dist
          uv build --no-build-isolation --python .venv/bin/python \
            --sdist --out-dir dist
          uv build --no-build-isolation --python .venv/bin/python \
            --wheel "dist/pyflyrail-${VERSION}.tar.gz" --out-dir dist
          test -f "dist/pyflyrail-${VERSION}.tar.gz"
          test -f "dist/pyflyrail-${VERSION}-py3-none-any.whl"

      - name: Verify isolated wheel and sdist installs
        working-directory: release-source
        run: |
          uv venv --python 3.11 .cache/release/wheel-env
          uv pip install --python .cache/release/wheel-env/bin/python \
            "python/dist/pyflyrail-${VERSION}-py3-none-any.whl"
          .cache/release/wheel-env/bin/python -I -c \
            "import importlib.metadata, flyrail; assert importlib.metadata.version('pyflyrail') == '${VERSION}'"
          uv venv --python 3.11 .cache/release/sdist-env
          uv pip install --no-cache --reinstall \
            --python .cache/release/sdist-env/bin/python \
            "python/dist/pyflyrail-${VERSION}.tar.gz"
          .cache/release/sdist-env/bin/python -I -c \
            "import importlib.metadata, flyrail; assert importlib.metadata.version('pyflyrail') == '${VERSION}'"

      - name: Assemble verified release bundle
        working-directory: release-source
        run: |
          mkdir -p .cache/release/bundle/dist
          cp python/dist/* .cache/release/bundle/dist/
          uvx git-cliff@2.13.1 \
            --config python/cliff.toml \
            --include-path "python/**" \
            --include-path "spec/**" \
            --current --strip all \
            -o .cache/release/bundle/release-notes.md
          sed -i '/^## \[/d' .cache/release/bundle/release-notes.md
          PREVIOUS_TAG=$(python ../python/scripts/release_workflow.py \
            previous-tag "$RELEASE_TAG")
          if [ -n "$PREVIOUS_TAG" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$RELEASE_TAG" \
              >> .cache/release/bundle/release-notes.md
          fi

      - name: Save verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-release-bundle
          path: release-source/.cache/release/bundle
          if-no-files-found: error
          include-hidden-files: true

  platform-checks:
    needs: verify
    name: Python (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.14"
          - os: macos-15
            python: "3.11"
          - os: macos-15
            python: "3.14"
          - os: windows-2025
            python: "3.11"
          - os: windows-2025
            python: "3.14"
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_MANAGED_PYTHON: "1"
      FLYRAIL_TEST_CODEX_LOGIN_SHELL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.release-commit }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
          no-cache: true

      - name: Run supported-platform checks
        run: python python/scripts/check.py check

  publish-pypi:
    needs: [verify, platform-checks]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-bundle
          path: release-bundle

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: false

      - name: Publish verified distributions to PyPI
        run: |
          uv publish \
            --trusted-publishing always \
            --check-url https://pypi.org/simple \
            release-bundle/dist/*

  publish-github:
    needs: [verify, publish-pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Revalidate trusted publication code
        env:
          RELEASE_COMMIT: ${{ needs.verify.outputs.release-commit }}
        run: |
          test "$(python python/scripts/release_workflow.py validate-tag \
            "$RELEASE_TAG" "$RELEASE_COMMIT")" = "$RELEASE_COMMIT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-bundle
          path: release-bundle

      - name: Publish Python GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          args=()
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          python python/scripts/release_workflow.py publish \
            "$RELEASE_TAG" \
            "Flyrail for Python ${{ needs.verify.outputs.version }}" \
            release-bundle/release-notes.md \
            "${{ needs.verify.outputs.release-commit }}" \
            release-bundle/dist/* "${args[@]}"
