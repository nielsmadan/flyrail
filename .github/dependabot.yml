version: 2
updates:
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    groups:
      python-tooling:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
      day: monday
    groups:
      rust-tooling:
        patterns: ['*']
        update-types: ['patch', 'minor']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    groups:
      swift-packages:
        patterns: ['*']
