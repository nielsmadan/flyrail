version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    assignees:
      - "nielsmadan"
    ignore:
      # 0.15.2 reports column 0 for parse errors at end of input
      - dependency-name: "tomlkit"
        versions: ["0.15.2"]
    groups:
      non-breaking:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    assignees:
      - "nielsmadan"
    groups:
      non-breaking:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    assignees:
      - "nielsmadan"
    groups:
      non-breaking:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    assignees:
      - "nielsmadan"
    groups:
      non-breaking:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
