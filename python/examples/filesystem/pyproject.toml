[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "flyrail-example-notes"
version = "0.4.0"
description = "A notes word counter embedding Flyrail filesystem bundles."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyflyrail==0.2.0"]

[project.scripts]
flyrail-notes = "flyrail_example_notes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flyrail_example_notes"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/bundle", "/README.md", "/pyproject.toml", "/.gitignore"]
exclude = ["**/.cache", "**/.venv", "**/__pycache__", "**/*.py[cod]", "**/*.egg-info", "**/build", "**/dist", "**/.DS_Store"]
