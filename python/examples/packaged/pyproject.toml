[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "flyrail-example-checksum"
version = "2.1.0"
description = "A SHA-256 utility embedding Flyrail package resources."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyflyrail==0.1.0"]

[project.scripts]
flyrail-checksum = "flyrail_example_checksum.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flyrail_example_checksum"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/pyproject.toml", "/.gitignore"]
exclude = ["**/.cache", "**/.venv", "**/__pycache__", "**/*.py[cod]", "**/*.egg-info", "**/build", "**/dist", "**/.DS_Store"]
