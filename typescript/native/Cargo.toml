[package]
name = "flyrail-node"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]
test = false
doctest = false
bench = false

[features]
test-seams = []

[dependencies]
flyrail = { path = "../../rust" }
napi = { version = "3.16.1", default-features = false, features = ["napi9"] }
napi-derive = "3.7.0"

[build-dependencies]
napi-build = "2.6.0"

[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"

[workspace]

[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
