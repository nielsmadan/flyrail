[workspace]
members = [".", "examples/filesystem", "examples/packaged"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

[package]
name = "flyrail"
version.workspace = true
edition.workspace = true
description = "Reversible skills, instructions, MCP registrations, and hooks for AI agents"
readme = "README.md"
license-file = "LICENSE"
repository = "https://github.com/nielsmadan/flyrail"

[features]
interop-test-seams = []

[lints]
workspace = true

[dependencies]
caseless = "0.2.2"
libc = "0.2"
miniz_oxide = "0.9.1"
ryu = "1.0.20"
rustix = { version = "1.1", features = ["fs"] }
sha2 = "0.10.9"
unicode-normalization = "0.1.25"

[dev-dependencies]
base64 = "0.22.1"
serde_json = { version = "1", features = ["preserve_order"] }

[[test]]
name = "admission_races"
harness = false

[[example]]
name = "interop"
required-features = ["interop-test-seams"]
