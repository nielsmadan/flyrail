[package]
name = "flyrail-example-checksum"
version = "2.1.0"
edition.workspace = true
license = "MIT"
description = "A SHA-256 utility embedding Flyrail package resources"
readme = "README.md"
include = ["src/**", "resources/**", "README.md", "Cargo.toml"]

[[bin]]
name = "flyrail-checksum"
path = "src/main.rs"

[dependencies]
flyrail = { version = "0.1.0", path = "../.." }
serde_json = "1"
sha2 = "0.11.0"

[lints]
workspace = true
